name: 鲲论坛自动签到

on:
  schedule:
    # 每天北京时间 8:00 执行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test check-in logic
        run: python -m unittest discover -s tests

      - name: Run check-in
        env:
          KUN_COOKIE: ${{ secrets.KUN_COOKIE }}
          KUN_COOKIES: ${{ secrets.KUN_COOKIES }}
        run: python auto_checkin.py
